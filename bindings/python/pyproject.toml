[project]
name = "heb-tts-normalizer"
version = "0.1.0"
description = "Normalize Hebrew text for TTS: numbers, currency, dates, times and units become spoken words, ready for g2p."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["hebrew", "tts", "text-normalization", "g2p", "itn"]
authors = [
    { name = "thewh1teagle", email = "61390950+thewh1teagle@users.noreply.github.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Natural Language :: Hebrew",
    "Topic :: Text Processing :: Linguistic",
]
# None. The rules are in the native library; ctypes is in the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/thewh1teagle/heb-tts-normalizer"
Issues = "https://github.com/thewh1teagle/heb-tts-normalizer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heb_tts_normalizer"]
# The wheel carries a native library, so it belongs in platlib, not purelib. It would
# import either way, but a platform-tagged wheel claiming Root-Is-Purelib is a lie that
# confuses auditwheel, delocate and anything else reasoning about the tag.
pure-python = false
# The compiled library is dropped next to __init__.py before the wheel is built; see
# README.md. It is not in the source tree, so it is only forced in when present.
artifacts = [
    "src/heb_tts_normalizer/*.so",
    "src/heb_tts_normalizer/*.dylib",
    "src/heb_tts_normalizer/*.dll",
]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# The Hebrew in docstrings and defaults trips the ambiguous-character checks.
# UP006/007/035/045: typing.Dict & Optional are required on 3.9, which we support.
# N818: LibraryNotFound is an OSError; the "Error" suffix would read worse.
ignore = ["RUF001", "RUF002", "RUF003", "UP006", "UP007", "UP035", "UP045", "N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
