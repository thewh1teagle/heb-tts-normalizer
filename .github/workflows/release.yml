name: Release

# Builds every artifact `chore bundle <version>` expects to download, and attaches
# them to the release for tag v<version>. Nothing is published to PyPI or npm from
# here — that is `chore bundle` then `chore publish`, run by a human who has looked
# at dist/ first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  c:
    name: C ABI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # musl links the CRT statically by default, which suppresses cdylib output
          # entirely — the build "succeeds" and emits only .a and .rlib. ctypes needs a
          # real .so, so opt out of the static CRT for this target.
          # Built natively rather than through `cross`: cross runs in a container and
          # does not forward RUSTFLAGS, which this target needs.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
            rustflags: "-C target-feature=-crt-static"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # Both macOS targets build on the Apple-silicon runner: GitHub has retired
          # the Intel macos-13 image, so that leg queues forever rather than failing.
          # Cross-compiling to x86_64 needs no extra tooling — the Xcode SDK carries
          # both slices, so `cargo build --target x86_64-apple-darwin` just works.
          # Still two wheels rather than a universal2 fat binary: they map 1:1 onto
          # these artifacts, and pip gains nothing from fusing them.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build cdylib and staticlib
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross || 'false' }}" = "true" ]; then
            cross build -p heb-tts-normalizer-c --release --target ${{ matrix.target }}
          else
            cargo build -p heb-tts-normalizer-c --release --target ${{ matrix.target }}
          fi

      - name: Stage the artifact
        shell: bash
        run: |
          set -euo pipefail
          name="heb-tts-normalizer-c-${{ matrix.target }}"
          src="target/${{ matrix.target }}/release"
          mkdir -p "stage/$name"
          # One of these name shapes exists per platform; the rest are absent.
          for f in \
            libheb_tts_normalizer_c.so \
            libheb_tts_normalizer_c.dylib \
            libheb_tts_normalizer_c.a \
            heb_tts_normalizer_c.dll \
            heb_tts_normalizer_c.lib \
            heb_tts_normalizer_c.dll.lib
          do
            if [ -f "$src/$f" ]; then cp "$src/$f" "stage/$name/"; fi
          done
          cp LICENSE README.md "stage/$name/"
          # A cdylib is the whole point; a build that produced none is a failure, not
          # an empty tarball someone discovers at install time.
          ls "stage/$name" | grep -Eq '\.(so|dylib|dll)$' \
            || { echo "no shared library in $src"; ls -la "$src"; exit 1; }
          tar -C stage -czf "$name.tar.gz" "$name"
          ls -la "$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: heb-tts-normalizer-c-${{ matrix.target }}
          path: heb-tts-normalizer-c-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  wasm:
    name: wasm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: bindings/typescript/pnpm-lock.yaml

      - uses: getchore/setup-chore@v1

      - name: Build the wasm module
        run: chore wasm

      - name: Compile the TypeScript wrapper
        working-directory: bindings/typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:ts

      # pkg/ and dist/ are exactly what package.json ships, so `chore publish` can
      # upload CI's bytes with --ignore-scripts instead of rebuilding locally.
      - name: Pack
        run: tar -C bindings/typescript -czf heb-tts-normalizer-wasm.tar.gz pkg dist

      - uses: actions/upload-artifact@v4
        with:
          name: heb-tts-normalizer-wasm
          path: heb-tts-normalizer-wasm.tar.gz
          if-no-files-found: error

  release:
    name: Attach assets
    needs: [c, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          ls -la
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            assets/*.tar.gz
            assets/SHA256SUMS
          fail_on_unmatched_files: true
