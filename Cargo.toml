[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/thewh1teagle/heb-tts-normalizer"
authors = ["thewh1teagle"]

[workspace.dependencies]
heb-tts-normalizer = { path = "crates/heb-tts-normalizer", version = "0.2.0" }
fancy-regex = "0.14"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
